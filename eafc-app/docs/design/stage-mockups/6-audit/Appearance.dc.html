<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Appearance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#5FE3E8;text-decoration:none}a:hover{color:#8CF5F8}
.scr{width:390px;height:844px;position:relative;overflow:hidden;background-color:#03153F;background-image:radial-gradient(ellipse 75% 42% at 50% 78%,rgba(0,82,140,.95) 0%,rgba(0,82,140,0) 72%),radial-gradient(ellipse 90% 35% at 50% 0%,rgba(14,58,124,.9) 0%,rgba(14,58,124,0) 75%),linear-gradient(90deg,#020C30 0%,#06306A 50%,#020C30 100%);color:#EAF2FF;font-family:Inter,system-ui,sans-serif;font-size:14px}
.pad{padding:58px 20px 110px;display:flex;flex-direction:column;gap:14px}
.h{font-family:'Saira Condensed',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin:0}
.k{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#9FB3D1}
.mut{color:#9FB3D1}
.card{background:rgba(19,43,92,.92);border:1px solid #234480;border-radius:16px;padding:16px}
.row{display:flex;align-items:center;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border:0;background:#5FE3E8;color:#07163A;font:800 15px Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;width:100%;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.btn:hover{color:#07163A;background:#8CF5F8}
.btn2{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:12px;background:transparent;border:1px solid #5FE3E8;color:#5FE3E8;font:700 14px Inter,sans-serif;width:100%}
.ib{width:44px;height:44px;border-radius:12px;background:#132B5C;border:1px solid #234480;display:flex;align-items:center;justify-content:center;color:#EAF2FF;flex:none}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bot{position:absolute;left:20px;right:20px;bottom:36px;display:flex;flex-direction:column;gap:10px}
.th{display:flex;flex-direction:column;gap:8px;align-items:center;font:700 12px Inter,sans-serif;color:#C9D8EE;background:none;border:0;padding:0}
.th .pv{width:100%;height:92px;border-radius:12px;border:2px solid #234480}
.th.on .pv{border-color:#5FE3E8}
.th.on{color:#5FE3E8}
.bg{height:58px;border-radius:10px;border:2px solid #234480;display:flex;align-items:flex-end;padding:5px 6px;font:700 10px Inter,sans-serif;color:#EAF2FF}
.bg.on{border-color:#5FE3E8}
.sl{display:flex;align-items:center;gap:10px;font-size:13px}
.tr{flex:1;height:6px;border-radius:3px;background:#234480;position:relative}
.tr span{position:absolute;top:-6px;width:18px;height:18px;border-radius:50%;background:#5FE3E8;border:3px solid #07163A}
</style>
</helmet>
<div class="scr">
<div class="pad" style="gap: 12px">
<div class="top"><a class="ib" href="Settings.dc.html" aria-label="Back"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><span class="k">Appearance</span><span style="width: 44px"></span></div>
<span class="k">Theme</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<button class="th"><span class="pv" style="background: linear-gradient(90deg,#020C30,#06306A,#020C30)"></span>Dark</button>
<button class="th on"><span class="pv" style="background: linear-gradient(180deg,rgba(2,6,13,.3),rgba(2,6,13,.6)), linear-gradient(135deg,#1F4A8A,#0B1530 60%,#2CCFD6)"></span>Live Dark</button>
<button class="th"><span class="pv" style="background: linear-gradient(135deg,#220E0E,#7A1F1F)"></span>Custom</button>
</div>
<div class="card" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
<span class="k">Live Dark background</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<span class="bg on" style="background: linear-gradient(135deg,#1F4A8A,#2CCFD6)">Daily</span>
<span class="bg" style="background: linear-gradient(135deg,#5B3A06,#0B1530)">Trophies</span>
<span class="bg" style="background: linear-gradient(135deg,#0D3B2E,#0B1530)">WIS</span>
<span class="bg" style="background: linear-gradient(135deg,#303A55,#0B1530)">Stadium</span>
</div>
<div class="top"><span class="mut" style="font-size: 12px">My images · 1 / 3</span><button style="background: none; border: 0; color: #5FE3E8; font: 600 12px Inter,sans-serif; padding: 8px 0">+ Add image</button></div>
<div class="sl"><span style="width: 62px">Blur</span><div class="tr"><span style="left: 20%"></span></div><span class="mut" style="width: 26px; text-align: right">3</span></div>
<div class="sl"><span style="width: 62px">Blue overlay</span><div class="tr"><span style="left: 40%"></span></div><span class="mut" style="width: 26px; text-align: right">35%</span></div>
</div>
<div class="card" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; opacity: 0.6">
<div class="top"><span class="k">Custom colours</span><span class="mut" style="font-size: 11px">When Custom is selected</span></div>
<div class="row" style="gap: 10px; font-size: 12px"><span style="width: 26px; height: 26px; border-radius: 50%; background: #00D4FF"></span>Primary<span style="width: 26px; height: 26px; border-radius: 50%; background: #0099FF; margin-left: 6px"></span>Gradient<span style="width: 26px; height: 26px; border-radius: 50%; background: #220E0E; border: 1px solid #4A6AA5; margin-left: 6px"></span>Background</div>
</div>
</div>
<div class="bot"><button class="btn">Save</button></div>
</div>
</x-dc>

</html>
