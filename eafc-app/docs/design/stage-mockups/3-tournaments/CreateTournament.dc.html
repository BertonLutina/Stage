<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create tournament</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#5FE3E8;text-decoration:none}a:hover{color:#8CF5F8}
.scr{width:390px;height:844px;position:relative;overflow:hidden;background-color:#03153F;background-image:radial-gradient(ellipse 75% 42% at 50% 78%,rgba(0,82,140,.95) 0%,rgba(0,82,140,0) 72%),radial-gradient(ellipse 90% 35% at 50% 0%,rgba(14,58,124,.9) 0%,rgba(14,58,124,0) 75%),linear-gradient(90deg,#020C30 0%,#06306A 50%,#020C30 100%);color:#EAF2FF;font-family:Inter,system-ui,sans-serif;font-size:14px}
.pad{padding:58px 20px 110px;display:flex;flex-direction:column;gap:16px}
.h{font-family:'Saira Condensed',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin:0}
.k{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#9FB3D1}
.mut{color:#9FB3D1}
.card{background:#132B5C;border:1px solid #234480;border-radius:16px;padding:16px}
.row{display:flex;align-items:center;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border:0;background:#5FE3E8;color:#07163A;font:800 15px Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;width:100%;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.av{border-radius:50% !important}
.btn:hover{color:#07163A;background:#8CF5F8}
.btn2{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:14px;background:transparent;border:1px solid #5FE3E8;color:#5FE3E8;font:600 15px Inter,sans-serif;width:100%}
.chip{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:999px;background:#132B5C;border:1px solid #234480;color:#C9D8EE;font:600 13px Inter,sans-serif;white-space:nowrap}
.chip.on{background:#5FE3E8;color:#07163A;border-color:#5FE3E8}
.av{width:44px;height:44px;border-radius:12px;background:#234480;display:flex;align-items:center;justify-content:center;font:800 16px 'Saira Condensed',sans-serif;color:#8CF5F8;flex:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ib{width:44px;height:44px;border-radius:12px;background:#132B5C;border:1px solid #234480;display:flex;align-items:center;justify-content:center;color:#EAF2FF;flex:none}
.in{display:flex;flex-direction:column;gap:6px}
.in input,.in select,.in textarea{height:50px;border-radius:12px;border:1px solid #234480;background:#07163A;color:#EAF2FF;padding:0 14px;font:500 15px Inter,sans-serif}
.in label{font-size:12px;font-weight:600;color:#9FB3D1}
.tabs{position:absolute;left:16px;right:16px;bottom:24px;height:64px;border-radius:22px;background:#07163A;border:1px solid #234480;display:flex;align-items:center;justify-content:space-around}
.tab{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:#9FB3D1;border-radius:14px}
.tab.on{color:#5FE3E8;background:#132B5C}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sep{height:1px;background:#234480}
.sec{display:flex;justify-content:space-between;align-items:baseline}
.ok{color:#4ADE80}.bad{color:#F87171}
.fmt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;text-align:center;color:#EAF2FF;font:inherit}
</style>
</helmet>
<div class="scr">
<div class="pad" style="gap: 16px">
<div class="top"><a class="ib" href="Tournaments.dc.html" aria-label="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a><span class="k">New tournament</span><span style="width: 44px"></span></div>
<h1 class="h" style="font-size: 34px">Create tournament</h1>
<div class="in"><label for="n">Name</label><input id="n" placeholder="Autumn Champions Cup"></div>
<div class="in"><span style="font-size: 12px; font-weight: 600; color: #9FB3D1">Format</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<button class="card fmt"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg><b style="font-size: 13px">League</b></button>
<button class="card fmt" style="border-color: #5FE3E8; background: #16346B"><svg class="i" style="color: #5FE3E8" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="8" height="7" rx="1"></rect><rect x="13" y="4" width="8" height="7" rx="1"></rect><path d="M7 15v5h10v-5"></path></svg><b style="font-size: 13px">Groups + KO</b></button>
<button class="card fmt"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h5v6h5M3 19h5v-6M13 11v2h8"></path></svg><b style="font-size: 13px">Knockout</b></button>
</div></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div class="in"><label for="c">Clubs</label><select id="c"><option>16</option></select></div>
<div class="in"><label for="p">Platform</label><select id="p"><option>PS5</option></select></div>
<div class="in"><label for="s">Start date</label><input id="s" value="02 Nov 2026"></div>
<div class="in"><label for="f">Entry fee (STC)</label><input id="f" value="0"></div>
</div>
<div class="in"><label for="r">Rules</label><textarea id="r" style="height: 84px; padding: 12px 14px; resize: none" placeholder="Match length, kick-off windows, disputes…"></textarea></div>
</div>
<div style="position: absolute; left: 20px; right: 20px; bottom: 40px"><a class="btn" href="TournamentDetail.dc.html">Create tournament</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

}
</script>
</body>
</html>
